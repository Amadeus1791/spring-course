# slf4j-simple: only warnings and errors, on System.out next to the println lines.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Lab 2.1, task 3: Spring checks a class for final methods only when this logger is at INFO,
# and then warns about each public final method that the CGLIB proxy cannot intercept.
org.slf4j.simpleLogger.log.org.springframework.aop.framework.CglibAopProxy=info
